# netdiag.modern-expo.ua -> Google Chat-бот діагностики підключення на mdlwr01 (netdiag_bot.py, https://172.17.61.225:5010)
# Розгорнуто 2026-11-12. DNS: Cloud DNS зона modern-expo-ua (проєкт me-cloud-dns-zones), A 188.163.216.105 (binat -> nginx2).
# Публічно лише POST /chat — Google Chat дзвонить зі своїх адрес; бот сам перевіряє OIDC-токен Google
# (aud = https://netdiag.modern-expo.ua/chat, email chat@system.gserviceaccount.com) і членство в noc@.
# Решта шляхів — LAN-only (healthz), інше — 404.

limit_req_zone $binary_remote_addr zone=netdiag_chat:10m rate=10r/s;

upstream netdiag_bot {
    server 172.17.61.225:5010;
    keepalive 4;
}

server {
    listen 80;
    server_name netdiag.modern-expo.ua;
    # без allow/deny: certbot (nginx authenticator) вставляє сюди HTTP-01 challenge
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name netdiag.modern-expo.ua;

    ssl_certificate     /etc/letsencrypt/live/netdiag.modern-expo.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netdiag.modern-expo.ua/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/netdiag.modern-expo.ua.access.log;
    error_log  /var/log/nginx/netdiag.modern-expo.ua.error.log;

    server_tokens off;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Бекенд: TLS до mdlwr01 з пінінгом самопідписаного серта бота (копія /opt/qradar-middleware/netdiag_tls/cert.pem)
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/nginx/ssl/netdiag-mdlwr01.pem;
    proxy_ssl_name                172.17.61.225;
    proxy_ssl_session_reuse       on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Google Chat app endpoint
    location = /chat {
        limit_except POST { deny all; }
        limit_req zone=netdiag_chat burst=20 nodelay;
        proxy_read_timeout 35s;
        proxy_pass https://netdiag_bot/chat;
    }

    location = /healthz {
        allow 172.17.0.0/16;
        allow 172.20.22.0/23;
        allow 172.20.24.0/24;
        deny all;
        proxy_pass https://netdiag_bot/healthz;
    }

    location / {
        return 404;
    }
}
